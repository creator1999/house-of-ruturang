<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-label="DRAPED IN TRADITION">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A4552" stop-opacity="0.24"/>
      <stop offset="0.6" stop-color="#7A4552" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#7A4552" stop-opacity="0.14"/>
    </linearGradient>
    <pattern id="dots" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="23" cy="23" r="1.4" fill="#7A4552" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="900" height="1200" fill="#FAF7F2"/>
  <rect width="900" height="1200" fill="url(#wash)"/>
  <rect width="900" height="1200" fill="url(#dots)"/>

  <!-- soft drape curves -->
  <path d="M0 864 C 270 744, 540 936, 900 792 L 900 1200 L 0 1200 Z" fill="#7A4552" opacity="0.07"/>

  <!-- hairline frame -->
  <rect x="40.5" y="54" width="819" height="1092" fill="none" stroke="#B69A74" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- ornament -->
  <g fill="none" stroke="#B69A74" stroke-opacity="0.5" stroke-width="2">
    <rect x="390" y="540" width="120" height="120" transform="rotate(45 450 600)"/>
    <circle cx="450" cy="600" r="9" fill="#B69A74" fill-opacity="0.5" stroke="none"/>
  </g>

  <text x="450" y="510" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="50" letter-spacing="6" fill="#282323">DRAPED IN TRADITION</text>
  <text x="450" y="1104" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="3" fill="#786D68">IMAGE COMING SOON</text>
  <text x="450" y="1146" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" letter-spacing="8" fill="#B69A74">RUTURANG</text>
</svg>
