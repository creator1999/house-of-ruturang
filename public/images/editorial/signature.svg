<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="THE SIGNATURE EDIT">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6E4A5A" stop-opacity="0.24"/>
      <stop offset="0.6" stop-color="#6E4A5A" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#6E4A5A" stop-opacity="0.14"/>
    </linearGradient>
    <pattern id="dots" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="23" cy="23" r="1.4" fill="#6E4A5A" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#FAF7F2"/>
  <rect width="1600" height="900" fill="url(#wash)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>

  <!-- soft drape curves -->
  <path d="M0 648 C 480 558, 960 702, 1600 594 L 1600 900 L 0 900 Z" fill="#6E4A5A" opacity="0.07"/>

  <!-- hairline frame -->
  <rect x="72" y="40.5" width="1456" height="819" fill="none" stroke="#B69A74" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- ornament -->
  <g fill="none" stroke="#B69A74" stroke-opacity="0.5" stroke-width="2">
    <rect x="740" y="390" width="120" height="120" transform="rotate(45 800 450)"/>
    <circle cx="800" cy="450" r="9" fill="#B69A74" fill-opacity="0.5" stroke="none"/>
  </g>

  <text x="800" y="360" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="88" letter-spacing="6" fill="#282323">THE SIGNATURE EDIT</text>
  <text x="800" y="828" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="3" fill="#786D68">IMAGE COMING SOON</text>
  <text x="800" y="859.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" letter-spacing="8" fill="#B69A74">RUTURANG</text>
</svg>
