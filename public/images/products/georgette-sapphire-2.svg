<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000" role="img" aria-label="Georgette Embroidered Saree — pallu detail">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#56627F" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#56627F" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#56627F" stop-opacity="0.13"/>
    </linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.4" fill="#56627F" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="800" height="1000" fill="#FAF7F2"/>
  <rect width="800" height="1000" fill="url(#wash)"/>
  <rect width="800" height="1000" fill="url(#dots)"/>

  <!-- soft drape curve -->
  <path d="M0 700 C 220 640, 420 740, 800 650 L 800 1000 L 0 1000 Z" fill="#56627F" opacity="0.06"/>

  <!-- gold double frame -->
  <rect x="36" y="36" width="728" height="928" fill="none" stroke="#B69A74" stroke-opacity="0.45" stroke-width="2"/>
  <rect x="46" y="46" width="708" height="908" fill="none" stroke="#B69A74" stroke-opacity="0.22" stroke-width="1"/>

  <!-- center motif -->
  <g fill="none" stroke="#B69A74" stroke-opacity="0.5" stroke-width="2">
    <rect x="340" y="502" width="120" height="120" transform="rotate(45 400 560)"/>
    <rect x="358" y="520" width="84" height="84" transform="rotate(45 400 560)"/>
    <circle cx="400" cy="560" r="9" fill="#B69A74" fill-opacity="0.5" stroke="none"/>
  </g>

  <text x="400" y="300" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#282323">Georgette Embroidered Saree</text>
  <line x1="340" y1="700" x2="460" y2="700" stroke="#B69A74" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="400" y="726" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="4" fill="#786D68">PALLU DETAIL</text>
  <text x="400" y="898" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="3" fill="#786D68" opacity="0.85">IMAGE COMING SOON</text>
  <text x="400" y="936" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" letter-spacing="8" fill="#B69A74">RUTURANG</text>
</svg>
